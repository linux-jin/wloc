name: Deploy Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少仓库 Secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少仓库 Secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
      - run: npm --prefix worker ci
      - run: npm run check
      - run: npm test
      - name: Sync site password
        working-directory: worker
        env:
          SITE_PASSWORD: ${{ secrets.CLOUDFLARE_ACCOUNT_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::缺少仓库 Secret CLOUDFLARE_ACCOUNT_PASSWORD"
            exit 1
          fi
          printf '%s' "$SITE_PASSWORD" | npx wrangler secret put CLOUDFLARE_ACCOUNT_PASSWORD
      - run: npm run deploy
        working-directory: worker
